# Шаг 2: сборка Android APK и публикация в Releases.
# Actions -> "2. Сборка APK" -> Run workflow. Идёт 40-90 минут.
#
# Нужны те же два секрета, что и для быстрой проверки:
#   UNITY_EMAIL, UNITY_PASSWORD
# Файл лицензии не нужен — Unity Hub активирует Personal по логину.
name: "2. Сборка APK"

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: "Архитектуры: both (ARMv7+ARM64) или arm64 (быстрее вдвое)"
        type: choice
        options: [both, arm64]
        default: both
      release:
        description: "Опубликовать APK в Releases"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Android (IL2CPP)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Проверить секреты до долгой работы
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          fail=0
          [ -z "$UNITY_EMAIL" ]    && { echo "::error ::Нет секрета UNITY_EMAIL (почта аккаунта Unity)"; fail=1; }
          [ -z "$UNITY_PASSWORD" ] && { echo "::error ::Нет секрета UNITY_PASSWORD (пароль аккаунта Unity)"; fail=1; }
          [ "$fail" = "1" ] && { echo "Инструкция: docs/BUILD.md"; exit 1; }
          echo "Секреты на месте."

      - name: Освободить место на раннере
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          df -h /

      # Сборка только под ARM64 идёт примерно вдвое быстрее: IL2CPP
      # компилирует нативный код отдельно для каждой архитектуры.
      - name: Выбрать архитектуры
        if: ${{ github.event.inputs.architectures == 'arm64' }}
        run: |
          f=Assets/Editor/NebulaProjectSetup.cs
          sed -i 's/AndroidArchitecture.ARMv7 | AndroidArchitecture.ARM64/AndroidArchitecture.ARM64/' "$f"
          grep -n "targetArchitectures" "$f"

      - name: Поставить Unity Hub и починить путь к нему
        uses: ./.github/actions/unity-hub

      - name: Установить Unity с модулем Android
        uses: buildalon/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: Android
          cache-installation: true
          auto-update-hub: false

      - name: Активировать лицензию Unity
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Собрать APK
        uses: buildalon/unity-action@v2
        with:
          project-path: ${{ github.workspace }}
          build-target: Android
          log-name: build-android
          args: -quit -batchmode -nographics -executeMethod Nebula.EditorTools.NebulaBuild.AndroidApk

      - name: Найти APK
        id: apk
        run: |
          path=$(find Builds -name "*.apk" -print -quit)
          [ -z "$path" ] && { echo "::error ::APK не найден"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          ls -lh "$path"

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: NebulaNine-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Опубликовать APK в Releases
        if: ${{ github.event.inputs.release != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" "$APK" \
            --title "Nebula Nine — APK" \
            --notes "Собрано Unity $(cat ProjectSettings/ProjectVersion.txt | head -1 | cut -d' ' -f2).

          Скачай .apk ниже и установи на телефон (нужно разрешить установку из неизвестных источников)."

      - name: Сохранить лог Unity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs-android
          path: "**/*.log"
          if-no-files-found: ignore
