# Шаг 2 из 2: сборка Android APK и публикация в Releases.
# Запускается вручную (Actions -> "2. Сборка APK" -> Run workflow)
# или автоматически при пуше тега вида v1.0.0.
name: "2. Сборка APK"

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Версия Unity (если у GameCI нет образа — впиши другую 2022.3.x)"
        required: true
        default: "2022.3.62f1"
      release:
        description: "Опубликовать APK в Releases"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Android (IL2CPP, ARMv7 + ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Проверить секреты до долгой работы
        run: |
          fail=0
          [ -z "$UNITY_EMAIL" ]    && { echo "::error ::Нет секрета UNITY_EMAIL (почта аккаунта Unity)"; fail=1; }
          [ -z "$UNITY_PASSWORD" ] && { echo "::error ::Нет секрета UNITY_PASSWORD (пароль аккаунта Unity)"; fail=1; }
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ] && [ ! -f ci/unity.ulf ]; then
            echo "::error ::Нужен UNITY_LICENSE (содержимое .ulf) либо UNITY_SERIAL, либо файл ci/unity.ulf"
            fail=1
          fi
          [ "$fail" = "1" ] && { echo "Инструкция: docs/BUILD.md"; exit 1; }
          echo "Секреты на месте."

      - name: Взять лицензию из ci/unity.ulf, если секрета нет
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ] && [ -f ci/unity.ulf ]; then
            echo "::warning ::Лицензия читается из файла ci/unity.ulf. Так можно только в приватном репозитории."
            D="ULF_$(date +%s%N)"
            { echo "UNITY_LICENSE<<$D"; cat ci/unity.ulf; echo "$D"; } >> "$GITHUB_ENV"
          fi

      - name: Освободить место на раннере
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          df -h /

      - name: Кэш Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Сборка Unity
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ github.event.inputs.unityVersion || '2022.3.62f1' }}
          targetPlatform: Android
          buildMethod: Nebula.EditorTools.NebulaBuild.AndroidApk
          allowDirtyBuild: true

      - name: Собрать APK в одну папку
        run: |
          mkdir -p out
          find . -name "*.apk" -not -path "./out/*" -exec cp -v {} out/ \; || true
          ls -la out

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: NebulaNine-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Опубликовать в Releases
        if: ${{ github.event.inputs.release != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" out/*.apk \
            --title "Nebula Nine — APK ($TAG)" \
            --notes "Сборка станции N-9. Скачай .apk и установи (потребуется разрешить установку из неизвестных источников)."
