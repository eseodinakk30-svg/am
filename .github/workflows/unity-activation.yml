# Шаг 1 из 2: получить файл активации Unity (.alf).
# Запускается вручную: вкладка Actions -> "1. Unity: запросить лицензию" -> Run workflow.
name: "1. Unity: запросить лицензию"

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Версия Unity (должна совпадать с ProjectSettings/ProjectVersion.txt)"
        required: true
        default: "2022.3.62f1"

jobs:
  activation:
    name: Запросить файл активации
    runs-on: ubuntu-latest
    steps:
      - name: Запросить .alf
        id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: ${{ github.event.inputs.unityVersion }}

      - name: Выложить .alf как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.request.outputs.filePath }}
