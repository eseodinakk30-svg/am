# Шаг 1: получить файл активации Unity (.alf).
# Actions -> "1. Unity: запросить лицензию" -> Run workflow.
# Файл кладётся в Releases отдельным файлом — с телефона он скачивается
# одним тапом, распаковывать zip не нужно.
name: "1. Unity: запросить лицензию"

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Версия Unity (как в ProjectSettings/ProjectVersion.txt)"
        required: true
        default: "2022.3.62f1"

jobs:
  activation:
    name: Запросить файл активации
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Запросить .alf
        id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: ${{ github.event.inputs.unityVersion }}

      - name: Выложить .alf в Releases (скачивается одним файлом)
        env:
          GH_TOKEN: ${{ github.token }}
          ALF: ${{ steps.request.outputs.filePath }}
        run: |
          set -e
          TAG="license-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" "$ALF" \
            --title "Файл активации Unity" \
            --notes "$(cat <<'TXT'
          Что делать дальше:

          1. Скачай прикреплённый файл `.alf` (тап по нему ниже).
          2. Открой https://license.unity3d.com/manual и войди в аккаунт Unity.
          3. Загрузи туда этот `.alf`.
          4. Выбери **Unity Personal Edition** и вариант
             «I don't use Unity in a professional capacity».
             ВАЖНО: если выбрать Plus или Pro — сайт потребует серийный код,
             которого у бесплатной лицензии нет. Именно на этом обычно застревают.
          5. Скачается файл `.ulf` — это и есть лицензия.
          6. Дальше по инструкции docs/BUILD.md: три секрета UNITY_LICENSE,
             UNITY_EMAIL, UNITY_PASSWORD.
          TXT
          )"

      - name: Продублировать как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.request.outputs.filePath }}
