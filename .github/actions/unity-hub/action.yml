# Unity Hub 3.20+ ставится в /usr/lib/unityhub, а unity-cli внутри экшенов
# Buildalon зашит на старый путь /opt/unityhub/unityhub. Апстрим это уже
# исправил, но в опубликованный бандл экшена правка ещё не попала.
#
# Здесь мы ставим Hub сами и раскладываем всё, на что экшен рассчитывает:
#   * UNITY_HUB_PATH        — путь, который unity-cli читает в первую очередь;
#   * /opt/unityhub/unityhub — симлинк для кода, знающего только старый путь;
#   * /usr/bin/unity-hub     — обёртка под xvfb, ИМЕННО ЕЁ экшен вызывает
#     как команду (`unity-hub --headless ...`), и без неё падает с
#     `spawn unity-hub ENOENT`.
name: "Unity Hub"
description: "Ставит Unity Hub и чинит пути к нему для экшенов Buildalon"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        echo "::group::Установка Unity Hub и зависимостей"
        curl -fsSL https://hub.unity3d.com/linux/keys/public \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/Unity_Technologies_ApS.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
          | sudo tee /etc/apt/sources.list.d/unityhub.list >/dev/null
        # libgconf-2-4 и libncurses5 выкинуты из noble, но Hub их всё ещё просит
        echo "deb https://archive.ubuntu.com/ubuntu jammy main universe" \
          | sudo tee /etc/apt/sources.list.d/jammy.list >/dev/null
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          unityhub xvfb ffmpeg libgtk2.0-0 libglu1-mesa libgconf-2-4 libncurses5 pulseaudio
        echo "::endgroup::"

        echo "Файлы пакета unityhub с именем unityhub:"
        dpkg -L unityhub | grep -E '/unityhub$' || true

        # Настоящий бинарник — единственный исполняемый ELF среди файлов пакета;
        # /usr/bin/unityhub у свежих версий это shell-обёртка, а не программа.
        hub=""
        while read -r f; do
          if [ -f "$f" ] && [ -x "$f" ] && file -b "$f" | grep -q ELF; then hub="$f"; break; fi
        done < <(dpkg -L unityhub | grep -E '/unityhub$')

        if [ -z "$hub" ]; then
          for c in /usr/lib/unityhub/unityhub /opt/unityhub/unityhub; do
            if [ -x "$c" ]; then hub="$c"; break; fi
          done
        fi

        if [ -z "$hub" ]; then
          echo "::error ::Не найден исполняемый файл Unity Hub"
          exit 1
        fi
        echo "Unity Hub: $hub"
        sudo chmod -R 777 "$(dirname "$hub")"

        if [ ! -e /opt/unityhub/unityhub ]; then
          sudo mkdir -p /opt/unityhub
          sudo ln -s "$hub" /opt/unityhub/unityhub
          echo "Совместимость: /opt/unityhub/unityhub -> $hub"
        fi

        # Hub — приложение на Electron, без экрана не стартует; xvfb-run по
        # умолчанию сливает stderr в stdout и ломает разбор вывода экшеном.
        sudo sed -i 's/^\(.*DISPLAY=:.*XAUTHORITY=.*\)\( "\$@" \)2>&1$/\1\2/' /usr/bin/xvfb-run
        printf '#!/bin/bash\nxvfb-run --auto-servernum %s "$@" 2>/dev/null\n' "$hub" \
          | sudo tee /usr/bin/unity-hub >/dev/null
        sudo chmod 777 /usr/bin/unity-hub

        echo "UNITY_HUB_PATH=$hub" >> "$GITHUB_ENV"
